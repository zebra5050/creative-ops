<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Creative Ops</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- =========================
       AUTH SECTION
  ========================== -->
  <section id="auth">
    <h2>Login / Register</h2>

    <input id="email" type="email" placeholder="Email" />
    <input id="password" type="password" placeholder="Password" />

    <button id="loginBtn" type="button">Login</button>
    <button id="registerBtn" type="button">Register</button>

    <p id="authStatus">Not logged in</p>
  </section>

  <!-- =========================
       APP SECTION
  ========================== -->
  <section id="app" style="display:none;">

    <!-- Top Bar -->
    <header class="top-bar">
      <button id="logoutBtnTop" type="button">Logout</button>
      <span id="authStatus"></span>
    </header>

    <!-- Status Graph -->
    <div id="status-graph-container">
      <div id="status-graph"></div>
    </div>

    <div class="dashboard">

      <!-- Left: Add Project -->
      <aside class="left-panel">
        <form id="project-form" novalidate>
          <h3>Add New Project</h3>

          <input id="title" type="text" placeholder="Project title" />

          <input id="type" type="text" placeholder="Type / Tag (optional)" />

          <input id="medium" type="text" placeholder="Medium / Tools" />

          <select id="status">
            <option>Idea</option>
            <option>Planning</option>
            <option>In Progress</option>
            <option>Paused</option>
            <option>Completed</option>
          </select>

          <button type="submit">Add Project</button>
        </form>
      </aside>

      <!-- Right: Project Columns -->
      <main class="right-panel">

        <div class="projects-columns">
          <div class="column">
            <h3>Idea</h3>
            <div id="col-idea"></div>
          </div>

          <div class="column">
            <h3>Planning</h3>
            <div id="col-planning"></div>
          </div>

          <div class="column">
            <h3>In Progress</h3>
            <div id="col-inprogress"></div>
          </div>

          <div class="column">
            <h3>Paused</h3>
            <div id="col-paused"></div>
          </div>

          <div class="column">
            <h3>Completed</h3>
            <div id="col-completed"></div>
          </div>
        </div>

      </main>
    </div>
  </section>

  <!-- =========================
       SCRIPT
  ========================== -->
  <script type="module" src="app.js"></script>

</body>
</html>
