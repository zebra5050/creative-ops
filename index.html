<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Creative Ops — Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- LOGIN -->
  <section id="auth">
    <h2>Login</h2>

    <input id="email" type="email" placeholder="Email" autocomplete="email" />
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" />

    <button id="loginBtn" type="button">Login</button>

    <p id="authStatusAuth">Not logged in</p>

    <p style="margin-top:12px; opacity:.85;">
      New here? <a href="register.html">Create an account</a>
    </p>
  </section>

  <!-- APP -->
  <section id="app" style="display:none;">
    <header class="top-bar">
      <button id="logoutBtnTop" type="button">Logout</button>
      <span id="authStatusApp"></span>
    </header>

    <div id="status-graph-container">
      <div id="status-graph"></div>
    </div>

    <!-- ✅ SEARCH BAR -->
    <div class="search-row">
      <input
        id="searchInput"
        type="text"
        placeholder="Search title, medium, type, or tags (ex: crochet, #webdev)..."
        autocomplete="off"
      />
    </div>

    <div class="dashboard">
      <aside class="left-panel">
        <form id="project-form" novalidate>
          <h3>Add New Project</h3>

          <input id="title" type="text" placeholder="Project title" />
          <input id="type" type="text" placeholder="Type (optional)" />
          <input id="medium" type="text" placeholder="Medium / Tools" />

          <!-- ✅ TAGS INPUT -->
          <input id="tags" type="text" placeholder="Tags (ex: #art #crochet #webdev)" />

          <select id="status">
            <option>Idea</option>
            <option>Planning</option>
            <option>In Progress</option>
            <option>Paused</option>
            <option>Completed</option>
          </select>

          <button id="addProjectBtn" type="submit">Add Project</button>
        </form>
      </aside>

      <main class="right-panel">
        <div class="projects-columns">
          <div class="column">
            <h3>Idea</h3>
            <div id="col-idea"></div>
          </div>

          <div class="column">
            <h3>Planning</h3>
            <div id="col-planning"></div>
          </div>

          <div class="column">
            <h3>In Progress</h3>
            <div id="col-inprogress"></div>
          </div>

          <div class="column">
            <h3>Paused</h3>
            <div id="col-paused"></div>
          </div>

          <div class="column">
            <h3>Completed</h3>
            <div id="col-completed"></div>
          </div>
        </div>
      </main>
    </div>
  </section>

  <!-- IMAGE MODAL -->
  <div id="imgModal" class="img-modal" aria-hidden="true">
    <div class="img-modal-inner" role="dialog" aria-modal="true">
      <button id="imgModalClose" class="img-modal-close" type="button">✕</button>
      <img id="imgModalImage" class="img-modal-image" alt="Full size preview" />
      <div id="imgModalCaption" class="img-modal-caption"></div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
