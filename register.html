<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Creative Ops — Register</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <section id="auth">
    <h2>Create Account</h2>

    <input id="regEmail" type="email" placeholder="Email" autocomplete="email" />
    <input id="regPassword" type="password" placeholder="Password" autocomplete="new-password" />

    <button id="registerPageBtn" type="button">Create Account</button>

    <div id="registerMsg" style="margin-top:12px; opacity:.9;"></div>

    <p style="margin-top:12px; opacity:.85;">
      Already have an account? <a href="index.html">Back to login</a>
    </p>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
