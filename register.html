<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Creative Ops — Register</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <section id="auth" class="auth-shell">
    <div class="auth-card">
      <h2>Create Account</h2>

      <div id="registerCard" class="notice-card" style="display:none;"></div>

      <label class="auth-label" for="regEmail">Email</label>
      <input id="regEmail" type="email" placeholder="you@email.com" autocomplete="email" />

      <label class="auth-label" for="regPassword">Password</label>
      <input id="regPassword" type="password" placeholder="••••••••" autocomplete="new-password" />

      <button id="registerPageBtn" class="auth-btn" type="button">
        Create Account
      </button>

      <div class="auth-links">
        <button id="resendConfirmBtn" class="link-btn" type="button">
          Resend confirmation email
        </button>

        <button id="forgotPasswordBtn" class="link-btn" type="button">
          Forgot password?
        </button>
      </div>

      <p class="auth-foot">
        Already have an account? <a href="index.html">Back to login</a>
      </p>
    </div>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
